spring.application.name=flight-config-api

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flight_config_db}
spring.datasource.username=${DB_USERNAME:flight_user}
spring.datasource.password=${DB_PASSWORD:flight_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# JWT
jwt.secret=${JWT_SECRET:flightconfigapisecretkey1234567890abcdefghij}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Admin par défaut
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@flightconfig.com}
app.admin.password=${ADMIN_PASSWORD:admin123}